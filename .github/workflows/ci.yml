name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Verify and package
    runs-on: macos-15-intel
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Get signature verifier
        shell: bash
        run: |
          curl -fL --retry 3 -o "$RUNNER_TEMP/rcodesign.tar.gz" \
            https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign%2F0.29.0/apple-codesign-0.29.0-macos-universal.tar.gz
          echo "d98372d5524226ccf9dc0eda03d4e4f5826182dabb2fc3f2bd303ed9113a748d  $RUNNER_TEMP/rcodesign.tar.gz" | shasum -a 256 -c -
          tar xzf "$RUNNER_TEMP/rcodesign.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apple-codesign-0.29.0-macos-universal" >> "$GITHUB_PATH"
      - name: Build standard pkg
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: python3 tools/build.py --tag "$RELEASE_TAG"
      - name: Verify signatures, payloads and version selection
        run: python3 tools/test.py dist/WhateverXe-Graphics-*.pkg
      - uses: actions/upload-artifact@v4
        with:
          name: Packages
          path: |
            dist/*.pkg
            dist/SHA256SUMS
          if-no-files-found: error

  release:
    name: Prepare draft release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.repository == 'b00t0x/WhateverXe-Graphics'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: Packages
          path: dist
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 tools/release_notes.py "$RELEASE_TAG" > release-notes.md
          cd dist
          sha256sum -c SHA256SUMS
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > release-state; then
            test "$(cat release-state)" = true
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "$RELEASE_TAG" --notes-file ../release-notes.md
          fi
          gh release edit "$RELEASE_TAG" --notes-file ../release-notes.md
          gh release upload "$RELEASE_TAG" ./*.pkg SHA256SUMS --clobber
